
<!-- CONTACT -->
<section class="section contact" id="contact">
  <div class="inner">
    <div class="section-label">Contact</div>
    <h2 class="section-title">문의 및 리포트 의뢰</h2>
    <div class="contact-grid">
      <div class="contact-info">
        <p>분석 대상 필지의 지번(주소)과 간단한 용도를 알려주시면, 담당자가 확인 후 안내드립니다. 샘플 리포트도 무료로 제공합니다.</p>
        <div class="contact-item">
          <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          dscon36@naver.com
        </div>
        <div class="contact-item">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
          전화 상담은 이메일로 먼저 접수해 주세요
        </div>
        <div class="contact-item">
          <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          경기도 광주시 광주역9로 21(역동)
        </div>
      </div>
      <form class="contact-form" id="inquiryForm">
        <input type="text" id="inqName" placeholder="이름 또는 회사명" required>
        <input type="email" id="inqEmail" placeholder="이메일 주소" required>
        <input type="text" id="inqAddress" placeholder="분석 대상 지번 (예: 경기도 OO시 OO읍 OO리 123-4)">
        <textarea id="inqMessage" placeholder="문의 내용 (용도, 필요 시점 등)"></textarea>
        <button type="submit" id="inqBtn">문의 보내기</button>
        <div id="inqStatus" style="font-size:14px;color:#94A3B8;display:none;"></div>
      </form>
    </div>
  </div>
</section>
